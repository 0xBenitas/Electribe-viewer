# NINJAM server config (crew jam, anonymous, no recording).
# ⚠️ Directives validées contre le parseur upstream (server/ninjamsrv.cpp) —
# les booléens prennent yes/no, pas 0/1, et toute directive inconnue est
# silencieusement inopérante (le serveur démarre quand même).

Port 2049

# Jam ouverte pour la crew : logins anonymes (Jamtaba/Reaper « anonymous:pseudo »).
# « multi » autoriserait plusieurs pseudos depuis la même IP ; yes suffit.
AnonymousUsers yes
AnonymousUsersCanChat yes
AllowHiddenUsers no
AnonymousMaskIP yes

# Défauts musicaux (l'hôte peut changer le tempo en live depuis le cockpit / sa machine).
DefaultBPM 120
DefaultBPI 16

# 8 musiciens + le mixeur « radio » (ninjamcast, alimente /live) + marge.
MaxUsers 10

# Pas d'enregistrement serveur par défaut (vie privée). Directive réelle :
# SessionArchive <path> <fmt> pour l'activer.
